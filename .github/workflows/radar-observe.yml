name: Observe actual DEV Radar
on:
  push:
    branches: ["chatops/github-actions-20261013"]
permissions:
  contents: read
jobs:
  actual-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.21.0'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: node scripts/chatops/smoke.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
          PUBLIC_URL: https://dev.gobadminton.ru
          EXPECTED_SHA: 16b97821cccec15d9b26f4e8e2b3073dd0bb3ee3
          REQUIRE_RADAR: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: observed-dev-radar
          path: _out/radar/
