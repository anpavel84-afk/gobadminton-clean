name: Train dispatcher
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [auto, codex, cursor, agy]
        default: auto
        description: 'Requested author profile; exact task model and existing role/budget gates stay mandatory'
  push:
    branches: [chatops/actions-train-20261021]
    paths: ['.github/workflows/train-*.yml', 'scripts/chatops/actions_train/**', 'scripts/chatops/tests/test_actions_train*.py']
permissions:
  contents: read
concurrency:
  group: gobadminton-train-dispatch
  cancel-in-progress: false
  # Reconcile rereads the complete durable queue; retain only the latest wake-up.
  queue: single
jobs:
  commissioning:
    if: github.event_name == 'push' && github.repository_id == '1416250340'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 -B -m unittest discover -s scripts/chatops/tests -p 'test_actions_train*.py'
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository_id == '1416250340' && github.ref == 'refs/heads/dev' &&
      (github.actor_id == '318610566' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 42bf6ff74d8ca9e2427904b98786da1e98f86b97
          persist-credentials: false
      - name: One finite authenticated reconciliation; disabled server remains read-only
        run: python3 -B scripts/chatops/actions_train/client.py reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: train-reconcile, path: evidence/, retention-days: 90}
  # A separate hosted job may publish only a reviewed DRAFT. No DEV server,
  # source writer, SSH key or model token is present. The workflow-wide
  # gobadminton-train-dispatch concurrency group serializes all such writes.
  publish_phase_drafts:
    needs: reconcile
    if: >-
      needs.reconcile.result == 'success' && github.event_name == 'workflow_dispatch' &&
      github.repository_id == '1416250340' && github.ref == 'refs/heads/dev' &&
      (github.actor_id == '318610566' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 42bf6ff74d8ca9e2427904b98786da1e98f86b97
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: train-reconcile
          path: evidence
      - name: Publish immutable Owner-scoped planning DRAFT only
        run: python3 -B scripts/chatops/planning/phase_plan_publish_v2.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-plan-publication
          path: evidence/phase-plan-publication-v2.json
          retention-days: 90
