name: Train dispatcher
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [auto, codex, cursor, agy]
        default: auto
        description: 'Requested author profile; exact task model and existing role/budget gates stay mandatory'
  push:
    branches: [chatops/actions-train-20261021]
    paths: ['.github/workflows/train-*.yml', 'scripts/chatops/actions_train/**', 'scripts/chatops/tests/test_actions_train*.py']
permissions:
  contents: read
concurrency:
  group: gobadminton-train-dispatch
  cancel-in-progress: false
  queue: max
jobs:
  commissioning:
    if: github.event_name == 'push' && github.repository_id == '1416250340'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 -B -m unittest discover -s scripts/chatops/tests -p 'test_actions_train*.py'
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository_id == '1416250340' && github.ref == 'refs/heads/dev' &&
      (github.actor_id == '318610566' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6f48c999a09c9a4102692cf98780269ce8174f22
          persist-credentials: false
      - name: One finite authenticated reconciliation; disabled server remains read-only
        run: python3 -B scripts/chatops/actions_train/client.py reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: train-reconcile, path: evidence/, retention-days: 90}
