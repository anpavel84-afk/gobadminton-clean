name: Train dispatcher
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [auto, codex, cursor, agy]
        default: auto
        description: 'Requested author profile; exact task model and existing role/budget gates stay mandatory'
  issue_comment:
    types: [created]
  push:
    branches: [chatops/actions-train-20261021]
    paths: ['.github/workflows/train-*.yml', 'scripts/chatops/actions_train/**', 'scripts/chatops/tests/test_actions_train*.py']
permissions:
  contents: read
concurrency:
  group: gobadminton-train-dispatch
  cancel-in-progress: false
  queue: max
jobs:
  # Default branch receives Issue events. Relay only authentic Owner admissions to
  # the already permitted DEV dispatcher; no model/SSH/DEV secrets or new task authority.
  owner_admission_reconcile:
    if: >-
      github.event_name == 'issue_comment' && github.repository_id == '1416250340' &&
      github.actor_id == '318610566' && !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, 'GOBADMINTON_AUTONOMY_V1') ||
       startsWith(github.event.comment.body, 'GOBADMINTON_TRAIN_RECONCILE_V1'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Validate Owner Issue event and dispatch existing DEV train
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, urllib.request
          e = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert e['repository']['id'] == 1416250340 and e['action'] == 'created'
          assert e['sender']['id'] == e['comment']['user']['id'] == 318610566
          assert 'pull_request' not in e['issue'] and isinstance(e['issue']['number'], int)
          body = e['comment']['body']
          assert isinstance(body, str) and len(body.encode()) <= 32768
          marker, sep, raw = body.partition('\n')
          assert sep and marker in ('GOBADMINTON_AUTONOMY_V1', 'GOBADMINTON_TRAIN_RECONCILE_V1')
          record = json.loads(raw)
          assert isinstance(record, dict) and record.get('schema') == marker
          if marker == 'GOBADMINTON_AUTONOMY_V1':
              assert record.get('target') == 'dev' and record.get('kind') == 'source_only'
          else:
              assert record.get('profile') == 'auto'
          url = 'https://api.github.com/repos/anpavel84-afk/gobadminton-clean/actions/workflows/train-dispatch.yml/dispatches'
          req = urllib.request.Request(url,
              data=json.dumps({'ref':'dev','inputs':{'profile':'auto'}}).encode(),
              headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'],
                       'Accept':'application/vnd.github+json',
                       'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req, timeout=30) as response:
              assert response.status == 204
          print('Owner admission event relayed to existing DEV dispatcher (no task authority minted)')
          PY
  commissioning:
    if: github.event_name == 'push' && github.repository_id == '1416250340'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 -B -m unittest discover -s scripts/chatops/tests -p 'test_actions_train*.py'
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository_id == '1416250340' && github.ref == 'refs/heads/dev' &&
      (github.actor_id == '318610566' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d4567dfddbfc26d95236839343d841841067e72c
          persist-credentials: false
      - name: One finite authenticated reconciliation; disabled server remains read-only
        run: python3 -B scripts/chatops/actions_train/client.py reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: train-reconcile, path: evidence/, retention-days: 90}
