name: Train events
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ['Product CI', 'DEV deploy', 'Autonomy PR']
    types: [completed]
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [auto, codex, cursor, agy]
        default: auto
        description: 'Requested author profile; existing role and availability gates remain enforced'
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/train-*.yml']
permissions:
  contents: read
  actions: write
concurrency:
  group: gobadminton-train-events
  cancel-in-progress: false
  queue: max
jobs:
  wake:
    if: github.repository_id == '1416250340' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This job has NO deployment environment, SSH key, checkout or candidate execution.
      - name: Validate event and wake one finite dispatcher pass on the permitted dev ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import json, os, pathlib, re, urllib.request
          repo = 'anpavel84-afk/gobadminton-clean'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event['repository']['id'] == 1416250340
          kind = os.environ['GITHUB_EVENT_NAME']
          profile = 'auto'
          def api(path, data=None):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'gb-train-events'},
                  data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read(2097153)
              assert len(raw) <= 2097152
              return json.loads(raw) if raw else None
          if kind in ('issues', 'issue_comment'):
              if event.get('sender', {}).get('id') != 318610566:
                  print('Ignored: not Owner'); raise SystemExit(0)
              item = event['comment'] if kind == 'issue_comment' else event['issue']
              marker, sep, payload = (item.get('body') or '').partition('\n')
              if not sep or marker not in ('GOBADMINTON_AUTONOMY_V1', 'GOBADMINTON_RESUME_V1', 'GOBADMINTON_TRAIN_RECONCILE_V1'):
                  print('Ignored: no exact authorized marker'); raise SystemExit(0)
              if marker == 'GOBADMINTON_TRAIN_RECONCILE_V1':
                  control = json.loads(payload)
                  assert set(control) == {'schema', 'profile'} and control['schema'] == marker
                  profile = control['profile']
          elif kind == 'workflow_run':
              run_id = event['workflow_run']['id']
              assert type(run_id) is int and run_id > 0
              run = api('actions/runs/' + str(run_id))
              allowed = ('.github/workflows/ci.yml', '.github/workflows/dev-deploy.yml', '.github/workflows/autonomy-pr.yml')
              valid = (run.get('path') in allowed and run.get('status') == 'completed'
                       and run.get('event') == 'push' and run.get('repository', {}).get('id') == 1416250340
                       and run.get('head_repository', {}).get('id') == 1416250340
                       and (run.get('head_branch') == 'dev' or re.fullmatch(r'automation/issue-[1-9][0-9]*', run.get('head_branch', ''))))
              if not valid:
                  print('Ignored: unrelated or fork workflow'); raise SystemExit(0)
          elif kind == 'workflow_dispatch':
              assert event.get('sender', {}).get('id') == 318610566
              profile = event.get('inputs', {}).get('profile') or 'auto'
          elif kind == 'push':
              assert event.get('ref') == 'refs/heads/main'
          else:
              assert kind == 'schedule'
          assert profile in ('auto', 'codex', 'cursor', 'agy')
          # Explicit dispatch is supported for GITHUB_TOKEN. No retry of an uncertain POST:
          # durable unresolved Issues/checkpoints and the rescue schedule preserve task intent.
          api('actions/workflows/train-dispatch.yml/dispatches', {'ref': 'dev', 'inputs': {'profile': profile}})
          print('Confirmed: one dispatcher wake sent to dev; source-task admission stays on the execution path')
          PY
