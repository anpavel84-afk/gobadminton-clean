name: Product CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: ["chatops/**", "automation/**"]
permissions:
  contents: read
concurrency:
  group: product-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 scripts/check_foundation.py
      - name: Check bounded contract exemptions even on foundation failure
        if: always()
        run: |
          python3 -B scripts/test_email_contract_policy.py
          python3 -B scripts/test_check_foundation.py
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [api, web, admin, contracts]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: ./.github/actions/ci-setup
      - run: pnpm --filter @gobadminton/${{ matrix.package }} run typecheck
      - run: pnpm --filter @gobadminton/${{ matrix.package }} run lint
        if: success() || failure()
      - run: pnpm --filter @gobadminton/${{ matrix.package }} run test:unit
        if: success() || failure()
      - name: Admin-only extra path regression and standalone root/path builds
        run: |
          set -euo pipefail
          if [ "${{ matrix.package }}" = admin ]; then
            python3 -B scripts/chatops/tests/test_admin_path.py
            docker build --network=default -f apps/admin/Dockerfile -t admin-ci-root .
            docker build --network=default --build-arg ADMIN_DEV_PATH_BUILD=1 -f apps/admin/Dockerfile -t admin-ci-path .
            python3 -B scripts/chatops/tests/admin-standalone-http.py
          fi
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: ./.github/actions/ci-setup
      - run: bash scripts/chatops/db-ci.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '30f24bae57123c3fdb53ceef94ec6bae71e4fcd0' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-test-results
          path: _out/test-results/
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          find scripts/chatops -name '*.sh' -exec bash -n {} +
          python3 -B scripts/chatops/tests/test_ci_workflow.py
          python3 -B -m unittest discover -s scripts/chatops/tests -p "test_actions_train*.py"
          python3 -B scripts/chatops/ops/prepare_train_release.py check
          python3 -B -m unittest discover -s scripts/chatops/tests -p "test_phase_*.py"
          python3 -B scripts/chatops/tests/test_autonomous_issues.py
          node --check scripts/chatops/smoke.mjs
          python3 -B scripts/chatops/tests/test_admin_deploy.py
          sudo python3 scripts/chatops/tests/test_helper.py
