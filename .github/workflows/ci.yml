name: Product CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: ["chatops/**"]
permissions:
  contents: read
concurrency:
  group: product-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: bash scripts/chatops/ci.sh full
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-test-results
          path: _out/test-results/
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          find scripts/chatops -name '*.sh' -exec bash -n {} +
          node --check scripts/chatops/smoke.mjs
          sudo python3 scripts/chatops/tests/test_helper.py
