# GoBadminton Germany full DEV overlay v001, production services unchanged.
# Apply with root-only /srv/gobadminton-dev-preview/.env and existing base Compose.
services:
  api:
    image: gobadminton-dev-radar-api:16b97821cccec15d9b26f4e8e2b3073dd0bb3ee3
    environment:
      GIT_SHA: "16b97821cccec15d9b26f4e8e2b3073dd0bb3ee3"
      RADAR_DEV_MAP_PREVIEW_ENABLED: "1"
      RADAR_DEV_MAP_PREVIEW_VERSION: "moscow-20261007-p4-098a869f-v001"
      RADAR_DEV_MAP_PREVIEW_STYLE_SHA256: "a9d887c39bbdfca6ce2c1ab46b73b1d72217a50855aec033b2ad57a2087b8e03"
      # Dedicated DEV-only placeholder: moderation fails closed until separate real DEV key provisioned.
      OPENAI_MODERATION_API_KEY: ${DEV_ONLY_MODERATION_KEY:?requires-dev-key}
      PUBLIC_API_ORIGIN: https://dev.gobadminton.ru
      PUBLIC_WEB_ORIGIN: https://dev.gobadminton.ru
      ALLOWED_WEB_ORIGINS: https://dev.gobadminton.ru
      VK_CLIENT_ID: ${DEV_VK_CLIENT_ID:?dev-credential-missing}
      VK_CLIENT_SECRET: ${DEV_VK_CLIENT_SECRET:?dev-credential-missing}
      VK_REDIRECT_URI: https://dev.gobadminton.ru/v1/auth/vk/callback
      YANDEX_CLIENT_ID: ${DEV_YANDEX_CLIENT_ID:?dev-credential-missing}
      YANDEX_CLIENT_SECRET: ${DEV_YANDEX_CLIENT_SECRET:?dev-credential-missing}
      YANDEX_REDIRECT_URI: https://dev.gobadminton.ru/v1/auth/yandex/callback
    networks: [isolated_dev_backend, dev_web_api]
  web:
    image: gobadminton-dev-germany-web:16b97821-localapi-v001
    container_name: gobadminton-dev-germany-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      API_BASE_URL: http://api:3000
    ports:
      - "127.0.0.1:18086:3001"
    networks: [dev_web_api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 12s
      timeout: 6s
      retries: 15
      start_period: 20s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: "0.7"
    pids_limit: 128
networks:
  dev_web_api:
    name: gobadminton_dev_preview_web_api
    driver: bridge
