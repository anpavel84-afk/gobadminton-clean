# Germany host only (vmi3510488). Dedicated GoBadminton API vhost.
# Do not modify unrelated virtual hosts on this shared server.
# Upstream is loopback Compose bind: 127.0.0.1:18080

server {
    listen 80;
    listen [::]:80;
    server_name dev-api.gobadminton.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev-api.gobadminton.ru;

    ssl_certificate     /etc/letsencrypt/live/dev-api.gobadminton.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api.gobadminton.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 8m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
