# Moscow host only (ruvds-68jzd). Public web edge + same-origin /v1 proxy.
# Canonical host: gobadminton.ru ; www redirects permanently to apex.
# Browser path: /v1/* → https://dev-api.gobadminton.ru/v1/*

upstream gobadminton_web_upstream {
    server 127.0.0.1:18082;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name gobadminton.ru www.gobadminton.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://gobadminton.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gobadminton.ru;

    ssl_certificate     /etc/letsencrypt/live/gobadminton.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gobadminton.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://gobadminton.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gobadminton.ru;

    ssl_certificate     /etc/letsencrypt/live/gobadminton.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gobadminton.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 8m;

    # PLAN pushes runner snapshots over ordinary HTTPS; Moscow serves them locally.
    location = /runner-monitor-ingest {
        auth_basic "GoBadminton Runner";
        auth_basic_user_file /etc/nginx/.htpasswd-gobadminton-runner;
        limit_except POST { deny all; }

        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:17651/ingest;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_buffering off;
    }

    # Read-only public monitor UI backed by the last HTTPS-pushed snapshot.
    # Owner-authorized public read access; ingest remains separately protected.
    location ^~ /runner-monitor/ {
        auth_basic off;

        proxy_pass http://127.0.0.1:17651/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Bounded raw avatar derivative only. Do not let a stalled client/body or
    # upstream retain the editor for the general API route's 60-second window.
    # nginx owns framing: fixed Content-Length and HTTP/1.1 chunked are forwarded
    # without a hand-written Content-Length or Transfer-Encoding override.
    location = /v1/me/avatar {
        client_max_body_size 512k;
        client_body_timeout 12s;
        proxy_request_buffering off;
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
        proxy_pass https://dev-api.gobadminton.ru/v1/me/avatar;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host dev-api.gobadminton.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name dev-api.gobadminton.ru;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_next_upstream off;
    }

    # Same-origin API proxy → Germany DEV API over direct HTTPS.
    location /v1/ {
        proxy_pass https://dev-api.gobadminton.ru/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host dev-api.gobadminton.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name dev-api.gobadminton.ru;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://gobadminton_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
