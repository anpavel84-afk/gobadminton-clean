# Temporary HTTP-only Moscow edge used until AAAA DNS for gobadminton.ru
# is corrected (currently points off-host and breaks Let's Encrypt HTTP-01).
# Replace with moscow-gobadminton.ru.conf after TLS issuance.

upstream gobadminton_web_upstream {
    server 127.0.0.1:18082;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gobadminton.ru www.gobadminton.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Canonicalize www → apex even before TLS.
    if ($host = www.gobadminton.ru) {
        return 301 http://gobadminton.ru$request_uri;
    }

    location /v1/ {
        proxy_pass https://dev-api.gobadminton.ru/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host dev-api.gobadminton.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name dev-api.gobadminton.ru;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://gobadminton_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
