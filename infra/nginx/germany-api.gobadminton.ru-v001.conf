# Germany PROD API alias; keep historical dev-api.gobadminton.ru unchanged for existing OAuth.
server {
    listen 80;
    listen [::]:80;
    server_name api.gobadminton.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.gobadminton.ru;

    ssl_certificate /etc/letsencrypt/live/api.gobadminton.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gobadminton.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Retain existing PROD API Host contract until OAuth/callback origins migrate.
        proxy_set_header Host dev-api.gobadminton.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
    }
}
