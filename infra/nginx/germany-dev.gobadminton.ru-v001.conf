# GoBadminton German DEV, fully local Web/API. No cross-border /v1.
server {
    listen 80;
    listen [::]:80;
    server_name dev.gobadminton.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.gobadminton.ru;

    ssl_certificate /etc/letsencrypt/live/dev.gobadminton.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.gobadminton.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;

    location = /v1/me/avatar {
        client_max_body_size 512k;
        client_body_timeout 15s;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host dev.gobadminton.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host dev.gobadminton.ru;
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_next_upstream off;
    }
    location ^~ /v1/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host dev.gobadminton.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host dev.gobadminton.ru;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_next_upstream off;
    }
    location / {
        proxy_pass http://127.0.0.1:18086;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host dev.gobadminton.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host dev.gobadminton.ru;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
