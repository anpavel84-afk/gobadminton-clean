# GoBadminton Germany DEV-only local immutable Moscow map candidate.
# No Moscow/PROD reverse proxy; no API upload, no exposed control surface.
# Bounded static CORS: exact canonical https://gobadminton.ru may GET/HEAD this
# public basemap only (style/tiles/fonts). No credentials, no arbitrary origins.
location ^~ /map-assets/releases/moscow-20261007-p4-098a869f-v001/ {
    alias /usr/local/share/gobadminton-clean-dev-map/releases/moscow-20261007-p4-098a869f-v001/;
    autoindex off;
    # GET includes HEAD in nginx; OPTIONS only for minimal CORS preflight (Range).
    limit_except GET OPTIONS { deny all; }
    disable_symlinks on from=/usr/local/share/gobadminton-clean-dev-map;
    types {
        application/json json;
        application/geo+json geojson;
        application/x-protobuf pbf;
        application/octet-stream pmtiles;
        image/png png;
        text/plain txt md;
    }
    default_type application/octet-stream;
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/json application/geo+json application/x-protobuf text/plain;
    gzip_vary on;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Fixed ACAO — exact PROD app origin only; never reflect request Origin.
    add_header Access-Control-Allow-Origin "https://gobadminton.ru" always;
    # No Access-Control-Allow-Credentials (public basemap; credentials forbidden).
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Range, Content-Length, ETag" always;
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://gobadminton.ru";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        add_header Access-Control-Max-Age 86400;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }
}
# Block all other /map-assets paths rather than accidentally proxying to Next.js.
location ^~ /map-assets/ {
    return 404;
}

# Sanitized release projections only (root-owned evidence files). No private deploy journals.
location = /__release-info/dev.json {
    alias /var/lib/gobadminton-deploy-evidence/dev.json;
    default_type application/json;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location = /__release-info/prod.json {
    alias /var/lib/gobadminton-deploy-evidence/prod-managed.json;
    default_type application/json;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location ^~ /__release-info/ {
    return 404;
}
