# SOURCE ONLY: insert these four locations INTO the EXISTING main DEV HTTPS vhost.
# No new server, hostname, certificate or changes to existing general /v1 or other locations.
# Owner-authorized same-origin path entry is NOT independent-origin XSS isolation.
location = /admin {
    access_log off;
    error_log /dev/null crit;
    # Drop ALL query parameters; never propagate codes/activation into navigation.
    return 303 /admin/;
}
location ^~ /admin/ {
    # Codes/state are confidential on the browser -> AdminApp hop, including errors.
    access_log off;
    error_log /dev/null crit;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # No URI suffix: retain original /admin/... for Next's compiled basePath.
    proxy_pass http://127.0.0.1:18088;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Origin $http_origin;
}

# AdminApp forwards callbacks through PUBLIC main DEV /v1, not directly to API.
# Exact matches override the existing /v1 proxy only for these two Admin callbacks.
# Disable inherited access AND error/debug sinks: upstream errors include request URI.
# No URI suffix/rewrite/redirect: code/state must reach the existing API handler.
location = /v1/admin/auth/vk/callback {
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:18084;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Origin $http_origin;
}
location = /v1/admin/auth/yandex/callback {
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:18084;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Origin $http_origin;
}
