# SOURCE ONLY: insert these two locations INTO the EXISTING main DEV HTTPS vhost.
# No new server, hostname, certificate or changes to existing /v1 or other locations.
# Owner-authorized same-origin path entry is NOT independent-origin XSS isolation.
location = /admin {
    access_log off;
    # Drop ALL query parameters; never propagate codes/activation into navigation.
    return 303 /admin/;
}
location ^~ /admin/ {
    # Codes/state are confidential; also review inherited error/debug logging.
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # No URI suffix: retain original /admin/... for Next's compiled basePath.
    proxy_pass http://127.0.0.1:18088;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Origin $http_origin;
}
