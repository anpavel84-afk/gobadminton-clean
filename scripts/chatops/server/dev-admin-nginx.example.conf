# SOURCE TEMPLATE ONLY. DNS and real certificates must exist before operator enables.
# Add only to existing reviewed nginx config; nginx -t before reload.
server {
    listen 443 ssl;
    server_name dev-admin.gobadminton.ru;
    ssl_certificate /etc/letsencrypt/live/dev-admin.gobadminton.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-admin.gobadminton.ru/privkey.pem;
    # Provider callbacks contain codes; do not record query strings or headers.
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /v1/meta {
        proxy_pass http://127.0.0.1:18084/v1/meta;
        proxy_set_header Host $host;
    }
    # Keep route/cookie/Origin fences in existing AdminApp proxy. Do not send
    # /v1/admin straight to API: callback handoff is owned by AdminApp.
    location /v1/admin/ {
        proxy_pass http://127.0.0.1:18088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Origin $http_origin;
    }
    location /v1/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Origin $http_origin;
    }
}
