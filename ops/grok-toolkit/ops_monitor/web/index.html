<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OPS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>OPS · Монитор</title>
</head>
<body>
<main id="login" hidden>
  <h1>OPS · Монитор</h1>
  <form id="pinform" autocomplete="off">
    <label for="pin">PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="one-time-code" required>
    <button type="submit">Войти</button>
    <p id="loginerr" role="alert"></p>
  </form>
</main>
<main id="app" hidden>
  <header>
    <h1>OPS · Монитор</h1>
    <div id="fresh" class="chip">…</div>
  </header>
  <div id="banner" hidden></div>
  <section id="now"></section>
  <section id="backlog"></section>
  <section id="infra"></section>
  <section id="paused"></section>
  <section id="next"></section>
  <section id="done"></section>
  <section id="doneall"></section>
  <section id="outside"></section>
  <footer><span id="updated"></span> <button id="logout" type="button">Выйти</button></footer>
</main>
<script src="app.js"></script>
</body>
</html>
